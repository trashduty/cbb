name: CBB Opening Results Grader

on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cbb-data-writes
  cancel-in-progress: false

jobs:
  grade:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Grade frozen opening selections
        id: grade
        continue-on-error: true
        run: python src/utils/track_opening_results.py --grade
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      - name: Commit results and Pages data
        if: always()
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git add data/cbb_opening_snapshots.csv data/cbb_opening_ledger.csv data/cbb_opening_scores.json docs/cbb_opening_snapshots.csv docs/cbb_opening_ledger.csv docs/cbb_opening_results.json
          if ! git diff --staged --quiet; then
            git commit -m "Update frozen CBB opening results"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Report score update failure
        if: steps.grade.outcome == 'failure'
        run: exit 1
